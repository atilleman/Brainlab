<form [formGroup]="form" (ngSubmit)="submit()" class="dashboard-form">
  <h2>Create New Dashboard</h2>

  <label for="name">Dashboard Name</label>
  <input id="name" formControlName="name" placeholder="e.g. Sales Dashboard" />

  <div formArrayName="charts" class="chart-section">
    <div *ngFor="let chart of charts.controls; let i = index" [formGroupName]="i" class="chart-group">
      <h3>Chart {{ i + 1 }}</h3>

      <label>Chart Name</label>
      <input formControlName="name" placeholder="e.g. Monthly Revenue" />

      <label>Chart Type</label>
      <select formControlName="type">
        <option value="line">Line</option>
        <option value="bar">Bar</option>
        <option value="pie">Pie</option>
      </select>

      <label>Aggregation</label>
      <select formControlName="aggregation">
        <option value="Sum">Sum</option>
        <option value="Average">Average</option>
      </select>

      <div formArrayName="data" class="data-section">
        <h4>Chart Data</h4>
        <div *ngFor="let row of chart.get('data')['controls']; let j = index" [formGroupName]="j">
          <input formControlName="age" placeholder="Age" />
          <input formControlName="userCount" placeholder="User Count" />
        </div>
        <button type="button" (click)="addDataRow(i)">Add Row</button>
      </div>
    </div>
  </div>

  <button type="button" (click)="addChart()">Add Another Chart</button>
  <button type="submit">Create Dashboard</button>
</form>
